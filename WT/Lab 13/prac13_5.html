<!-- Write a JavaScript to take 2-digit number and then separate these 2 digits, then
multiply first digit by itself for second digit times. (For example, 23 should be separated
as 2 and 3. 2 should multiply with itself 3 times so ans will be 8). withour pre defined functions(B) -->
 <html>
    <head></head>
    <body>  
        <script>
            var n1=parseInt(prompt("Enter number:"));
            var firstDigit = Math.floor(n1 / 10);
            var secondDigit = n1 % 10;
            var result = 1;
            for (var i = 0; i < secondDigit; i++) {
                result *= firstDigit;
            }
            console.log("Result: " + result);
        </script>
    </body>
 </html>
