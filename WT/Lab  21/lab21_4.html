<!DOCTYPE html>
<html>
<head>
    <title>Student Bio</title>
</head>
<body>

    <h2>Student Bio</h2>

    <script>
        let name = prompt("Enter your name:");
        let age = prompt("Enter your age:");
        let city = prompt("Enter your city:");

        let bio = `My name is ${name}. I am ${age} years old and I live in ${city}.`;

        console.log(bio);

        document.write("<p>" + bio + "</p>");
    </script>

</body>
</html>
