// Create a function to calculate the square of a number using the traditional function
// keyword. Then rewrite the same function using arrow syntax. Show the difference in how
// this behaves inside each Traditional function
<!DOCTYPE html>
<html>
<head>
    <title>Traditional and Arrow Function</title>
</head>
<body>

    <h2>Square of a Number</h2>

    <script>
        // Traditional function
        function square(num) {
            return num * num;
        }

        // Arrow function
        const squareArrow = (num) => {
            return num * num;
        };

        let number = 5;

        console.log("Traditional Function:", square(number));
        console.log("Arrow Function:", squareArrow(number));

        document.write("Traditional Function: " + square(number) + "<br>");
        document.write("Arrow Function: " + squareArrow(number));
    </script>

</body>
</html>
