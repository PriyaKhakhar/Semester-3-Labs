<!-- Use Bootstrap typography to align text (left, center, right). (B) -->
 <!DOCTYPE html>
<html>
<head>
    <title>Text Alignment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <p class="text-start">This is Left Aligned</p>

        <p class="text-center">This is Center Aligned</p>

        <p class="text-end">This is Right Aligned</p>

    </div>

</body>
</html>
