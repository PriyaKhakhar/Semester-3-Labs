<!-- Use Bootstrap to display responsive image in webpage. Also use alignment to align it in
left, center and right side of webpage. (B) -->
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h2>Responsive Image</h2>

        <!-- Left -->
        <img src="image.png" class="img-fluid d-block me-auto" width="300">

        <br>

        <!-- Center -->
        <img src="image.png" class="img-fluid d-block mx-auto" width="300">

        <br>

        <!-- Right -->
        <img src="image.png" class="img-fluid d-block ms-auto" width="300">

    </div>

</body>
</html>
