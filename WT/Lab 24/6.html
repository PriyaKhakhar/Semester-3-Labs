<!-- Use Bootstrap to create thumbnail of image. (B) -->

<!DOCTYPE html>
<html>
<head>
    <title>Thumbnail Image</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h2>Thumbnail Image</h2>

        <img src="image.png"
             class="img-thumbnail"
             width="300">

    </div>

</body>
</html>
