<!-- WAP to create a basic graphical Calculator using HTML, JavaScript and CSS (A) -->

<!DOCTYPE html>

<html>
<head>
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

<h1>Simple Calculator</h1>

<div class="container">

    <form action="">

        <div class="screen">
            <input type="text" name="display" id="display">
        </div>

        <div class="num">
            <input class="btn" type="button" value="AC" onclick="clearAll()">
            <input class="btn" type="button" value="C" onclick="clearOne()">
            <input class="btn" type="button" value="%" onclick="percentage()">
            <input class="btn" type="button" value="/" onclick="add('/')">
        </div>

        <div class="num">
            <input class="btn" type="button" value="7" onclick="add('7')">
            <input class="btn" type="button" value="8" onclick="add('8')">
            <input class="btn" type="button" value="9" onclick="add('9')">
            <input class="btn" type="button" value="*" onclick="add('*')">
        </div>

        <div class="num">
            <input class="btn" type="button" value="4" onclick="add('4')">
            <input class="btn" type="button" value="5" onclick="add('5')">
            <input class="btn" type="button" value="6" onclick="add('6')">
            <input class="btn" type="button" value="-" onclick="add('-')">
        </div>

        <div class="num">
            <input class="btn" type="button" value="1" onclick="add('1')">
            <input class="btn" type="button" value="2" onclick="add('2')">
            <input class="btn" type="button" value="3" onclick="add('3')">
            <input class="btn" type="button" value="+" onclick="add('+')">
        </div>

        <div class="num">
            <input class="btn" type="button" value="00" onclick="add('00')">
            <input class="btn" type="button" value="0" onclick="add('0')">
            <input class="btn" type="button" value="." onclick="add('.')">
            <input class="btn" type="button" value="=" onclick="calculate()">
        </div>

    </form>

</div>

<script src="script1.js"></script>


</body>
</html>
