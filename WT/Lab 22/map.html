<!DOCTYPE html>
<html>
<head>
    <title>Map Example</title>
</head>
<body>
    <h2>Student Marks</h2>

    <script>
        let students = new Map();

        students.set("Priya", 90);
        students.set("Riya", 85);
        students.set("Krisha", 95);

        document.write("Priya's Marks: " + students.get("Priya") + "<br>");
        document.write("Riya's Marks: " + students.get("Riya") + "<br>");
        document.write("Krisha's Marks: " + students.get("Krisha"));
    </script>
</body>
</html>
