<!DOCTYPE html>
<html>
<head>
    <title>Map and Filter</title>
</head>
<body>
    <h2>Map and Filter Example</h2>

    <script>
        let numbers = [1, 2, 3, 4, 5, 6];

        // Double every number using map()
        let doubled = numbers.map(function(num) {
            return num * 2;
        });

        // Find even numbers using filter()
        let evenNumbers = numbers.filter(function(num) {
            return num % 2 === 0;
        });

        document.write("Original Array: " + numbers + "<br>");
        document.write("Doubled Array: " + doubled + "<br>");
        document.write("Even Numbers: " + evenNumbers);
    </script>
</body>
</html>
