<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>
    <h2>Shopping Cart Total</h2>

    <script>
        let prices = [100, 250, 150, 300];

        let total = prices.reduce(function(sum, price) {
            return sum + price;
        }, 0);

        document.write("Item Prices: " + prices + "<br>");
        document.write("Total Amount: ₹" + total);
    </script>
</body>
</html>
