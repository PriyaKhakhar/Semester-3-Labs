<!DOCTYPE html>
<html>
<head>
    <title>Set Example</title>
</head>
<body>
    <h2>Remove Duplicate Values</h2>

    <script>
        let numbers = [10, 20, 10, 30, 20, 40, 30];

        let uniqueNumbers = new Set(numbers);

        document.write("Original Array: " + numbers + "<br>");
        document.write("Unique Values: " + [...uniqueNumbers]);
    </script>
</body>
</html>
