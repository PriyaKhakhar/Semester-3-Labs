<!-- WAP to read an array from the user and sort them using bubble sort. (B) -->
<html>
    <head>
        <title></title>
    </head>
    <body>
        <script>
                let arr3 = [];

                for (let i = 0; i < n; i++) {
                    arr3[i] = parseInt(prompt("Enter element for Bubble Sort:"));
                } 

                for (let i = 0; i < n - 1; i++) {
                    for (let j = 0; j < n - i - 1; j++) {
                        if (arr3[j] > arr3[j + 1]) {
                            let temp = arr3[j];
                            arr3[j] = arr3[j + 1];
                            arr3[j + 1] = temp;
                        }
                    }
                }

                console.log("3. Array after Bubble Sort:");

                for (let i = 0; i < n; i++) {
                    console.log(arr3[i]);
                }
        </script>
    </body>
</html>
