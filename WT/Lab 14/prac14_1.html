    <body>
        <script>
            let arr1 = [10, 25, 5, 40, 15];

            let max = arr1[0];

            for (let i = 1; i < arr1.length; i++) {
                if (arr1[i] > max) {
                    max = arr1[i];
                }
            }
            document.write("1. Maximum number = " + max);

        </script>
    </body>
