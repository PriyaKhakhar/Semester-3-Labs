<!-- Build a webpage that combines pseudo-classes and pseudo-elements — for example,
changing the color of the ::first-letter only on :hover of a paragraph. -->
<html>
    <head>
        <style>
            p:hover::first-letter {
                color: red;
                font-size: 30px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <p>Hover over this paragraph to see the first letter change its style.</p>
    </body>
</html>
