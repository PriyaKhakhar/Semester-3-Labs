<!DOCTYPE html>
<html>
<head>
    <title>Destructuring</title>
</head>
<body>

<script>
    let fruits = ["Apple", "Banana", "Mango"];

    let [a, b, c] = fruits;

    document.write(a + "<br>");
    document.write(b + "<br>");
    document.write(c + "<br>");
</script>

</body>
</html>
