<!DOCTYPE html>
<html>
<head>
    <title>Let and Var</title>
</head>
<body>

<script>
    var a = 10;
    let b = 20;

    document.write("Value of var: " + a + "<br>");
    document.write("Value of let: " + b + "<br>");

    var a = 30;     
    // let b = 40;  

    document.write("New value of var: " + a);
</script>

</body>
</html>
